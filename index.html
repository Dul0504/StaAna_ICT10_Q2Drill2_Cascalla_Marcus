<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2nd Quarter | Drill 2</title>
    <style>
        /* brown palette, all in one spot so it's easy to tweak */
        :root {
            --mocha: #4b3426;
            --coffee: #6f4e37;
            --latte: #b08968;
            --cream: #f5ebe0;
            --paper: #fffaf3;
        }

        /* times new roman everywhere, even the inputs and buttons */
        body,
        input,
        button {
            font-family: "Times New Roman", Times, serif;
        }

        body {
            background-color: var(--cream);
            color: var(--mocha);
        }

        h3 {
            color: var(--mocha);
            font-weight: bold;
        }

        /* the card that holds the form */
        .form-card {
            background-color: var(--paper);
            border: 2px solid var(--latte);
            border-radius: 12px;
            padding: 24px;
        }

        .form-control {
            border: 1px solid var(--latte);
            background-color: var(--cream);
            color: var(--mocha);
            font-size: 18px;
        }

        .form-control:focus {
            border-color: var(--coffee);
            box-shadow: 0 0 0 0.2rem rgba(111, 78, 55, 0.3);
            background-color: #fff;
        }

        /* overriding bootstrap blue so the button goes brown */
        .btn-brown {
            background-color: var(--coffee);
            border-color: var(--coffee);
            color: var(--cream);
            font-size: 18px;
            padding: 6px 28px;
        }

        .btn-brown:hover,
        .btn-brown:focus {
            background-color: var(--mocha);
            border-color: var(--mocha);
            color: #fff;
        }

        /* results box */
        #output {
            background-color: var(--mocha);
            color: var(--cream);
            font-size: 20px;
            border-left: 8px solid var(--latte);
        }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5" style="max-width: 720px;">
        <h3 class="mb-4">Add new club member:</h3>

        <!-- name inputs + button -->
        <form class="form-card mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
            </div>
            <!-- py-click calls result_checker() in main.py -->
            <input type="button" value="Submit" py-click="result_checker" class="btn btn-brown">
        </form>

        <!-- python fills this part in -->
        <div id="output" class="p-3 rounded"></div>
    </div>

    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
